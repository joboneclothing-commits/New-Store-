<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vartan Store</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --accent:#1e6f5c; --bg:#f7f6f2; --card:#ffffff; --text:#222; --muted:#777; --danger:#b3413d; --warn:#c98a1f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14171a; --card:#1f2327; --text:#eee; --muted:#9aa0a6; }
}
:root[data-theme="dark"]{ --bg:#14171a; --card:#1f2327; --text:#eee; --muted:#9aa0a6; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
body{max-width:520px;margin:0 auto;padding:10px 12px 90px;}
h1{font-size:19px;margin:10px 0 4px;}
h2{font-size:15px;margin:14px 0 6px;color:var(--muted);}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px;}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc4;border-radius:8px;background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;}
button{padding:10px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;}
button.secondary{background:#8884;color:var(--text);}
button.danger{background:var(--danger);}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:8px 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 6px rgba(0,0,0,.1);max-width:520px;margin:0 auto;overflow-x:auto;}
.tabs button{flex:1;background:none;color:var(--muted);font-weight:600;font-size:11px;margin:0 2px;padding:8px 2px;white-space:nowrap;}
.tabs button.active{background:var(--accent);color:#fff;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.plist{display:flex;flex-direction:column;gap:8px;}
.pitem{display:flex;gap:10px;background:var(--card);border-radius:10px;padding:10px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.pitem img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#8882;flex-shrink:0;}
.pinfo{flex:1;min-width:0;}
.pinfo b{font-size:14px;}
.pinfo span{display:block;font-size:12px;color:var(--muted);}
.pnum{display:inline-block;background:var(--accent);color:#fff;font-size:11px;border-radius:5px;padding:1px 6px;margin-right:5px;}
.stocklow{color:var(--warn);font-weight:600;}
.stockcritical{color:var(--danger);font-weight:700;}
.catheader{font-size:13px;font-weight:700;color:var(--accent);margin:12px 0 4px;}
.catchip{display:inline-block;background:var(--bg);border:1px solid #8886;color:var(--text);font-size:12px;padding:4px 10px;border-radius:14px;}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar{width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;}
.barval{font-size:10px;color:var(--muted);margin-bottom:2px;}
.barlabel{font-size:10px;color:var(--muted);margin-top:4px;}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #8882;font-size:14px;}
.stat:last-child{border:none;}
.search{margin-bottom:10px;}
.empty{color:var(--muted);text-align:center;padding:20px 0;font-size:14px;}
.small{font-size:12px;color:var(--muted);margin-top:4px;}
.dtile{background:var(--card);border-radius:10px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.dtile .v{font-size:18px;font-weight:700;}
.dtile .l{font-size:11px;color:var(--muted);margin-top:2px;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.cartitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #8882;font-size:13px;}
.cartitem:last-child{border:none;}
.qtybtn{width:30px;padding:6px;text-align:center;flex:none;}
.hl{outline:2px solid var(--accent);background:rgba(30,111,92,.18) !important;}
.dayhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--accent);margin:12px 0 4px;}
.receipt{font-family:monospace;font-size:13px;white-space:pre-wrap;background:var(--card);border-radius:10px;padding:14px;}
</style>
</head>
<body>


<h1>Vartan Store</h1>


<div id="tab-home" class="tab-content active">
  <div class="dgrid">
    <div class="dtile"><div class="v" id="dToday">₹0</div><div class="l">Today's Sale</div></div>
    <div class="dtile"><div class="v" id="dProfit">₹0</div><div class="l">Today's Profit</div></div>
    <div class="dtile"><div class="v" id="dItems">0</div><div class="l">Items Sold Today</div></div>
    <div class="dtile"><div class="v" id="dMonth">₹0</div><div class="l">Monthly Sale</div></div>
  </div>
  <div class="card">
    <div class="stat"><span>Total Stock Value</span><b id="dStockVal">₹0</b></div>
    <div class="stat"><span>⚠️ Low Stock Items</span><b id="dLowCount">0</b></div>
    <div class="stat"><span>Last Backup</span><b id="dBackup">—</b></div>
  </div>
  <div class="row">
    <button onclick="showTab('add')">➕ Add Product</button>
    <button onclick="showTab('sell')">🛒 Sell</button>
  </div>
</div>


<div id="tab-add" class="tab-content">
  <div class="card">
    <label>Product Photo</label>
    <input type="file" id="imgInput" accept="image/*" capture="environment">
    <img id="imgPreview" style="max-width:100%;border-radius:8px;margin-top:6px;display:none;">
    <div class="small" id="imgSizeNote"></div>


    <div class="row">
      <div><label>Product Number</label><input id="pnumber" placeholder="Auto"></div>
      <div><label>Barcode</label><input id="pbarcode" placeholder="Scan or type"></div>
   
    </div>
